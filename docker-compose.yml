# ============================================================
# ai-investor-bot — docker compose 定義
# ------------------------------------------------------------
# 使い方の基本形（cron からもこの形で叩く）:
#
#   docker compose run --rm bot python main.py --screen --notify-line
#   └────────┬───────┘ └┬┘ └┬┘ └──────────┬──────────────────┘
#            │           │   │             └ コンテナ内で実行するコマンド
#            │           │   └ このファイルで定義したサービス名
#            │           └ 実行が終わったらコンテナを削除する
#            └ サービスを1回だけ実行する（up と違い常駐しない）
#
# なぜ `up -d` で常駐させないのか:
#   このボットは「1日数回、決まった時刻に走って終わる」バッチであって
#   常時待ち受けるサーバーではない。常駐させると
#   ・コンテナ内で cron を動かすことになり、ログが docker logs に埋もれる
#   ・1回だけ手で実行して確認する、が出来なくなる
#   ・プロセスが死んでいるのに生きているように見える（過去に本番で発生）
#   ので、スケジューリングはホストの cron に任せる。
# ============================================================

services:
  bot:
    # ── イメージのビルド設定 ────────────────────────────────
    build:
      # ビルドコンテキスト = このディレクトリ。
      # 何が送られるかは .dockerignore が決める。
      context: .
      dockerfile: Dockerfile
      args:
        # コンテナ内ユーザーの UID/GID をホストと合わせる。
        # 合っていないと、コンテナが data/ に新規作成したファイルが
        # ホスト側で root 所有になり、ホストから触れなくなる。
        #
        # ${HOST_UID:-1000} は「環境変数 HOST_UID があればそれ、無ければ 1000」。
        # 開発機・本番機とも 1000 なので通常は既定値のままでよい。
        # 違う場合は実行前に `export HOST_UID=$(id -u) HOST_GID=$(id -g)`。
        # （UID / GID という名前を使わないのは、bash では UID が
        #   readonly 変数で export できず、はまりやすいため）
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}

    # イメージに名前を付けておく。付けないと
    # `ai-investor-bot-bot` のような自動生成名になり、
    # docker images で探しにくい。
    image: ai-investor-bot:latest

    # ── 秘密情報の渡し方 ────────────────────────────────────
    # .env を「イメージに焼き込まず」「実行時に環境変数として」渡す。
    # 中身は Alpaca 実弾取引の API キーなので、イメージに入れると
    # イメージを配布・push した時点で漏洩する。
    # env_file なら .env はホストに置いたままで、コンテナ起動時に
    # 環境変数として注入されるだけ。イメージには残らない。
    #
    # アプリ側は load_dotenv() を呼んでいるが、環境変数が既に
    # セットされていればそちらが使われるので、そのままで動く。
    env_file:
      - .env

    environment:
      # Dockerfile でも設定しているが、ここにも書いておく。
      # 「このコンテナは JST で動く」という運用上の前提を
      # compose ファイルだけ見て分かるようにするため。
      # cron が 23:00 JST 前提なので、ここがずれると
      # 市場時間外に発注判断が走る。
      - TZ=Asia/Tokyo

    # ── volume（状態ファイルの永続化） ──────────────────────
    # 【このプロジェクトで最も重要な設定】
    #
    # コンテナのファイルシステムは `--rm` で毎回消える。
    # 消えて良いもの（Python の実行環境、ソースコード）と
    # 絶対に消してはいけないもの（ポートフォリオ、学習データ）を
    # ここで分離する。
    #
    # 書式は  ホスト側のパス:コンテナ側のパス
    # 左が「本体」、右は「コンテナから見える場所」。
    # 実体はホストにあるので、コンテナを作り直しても消えない。
    #
    # `./data` のように相対パスで書くと、この docker-compose.yml が
    # あるディレクトリからの相対になる。絶対パスを書かないので
    # 自宅機に clone した先が /home/naito でも /home/komek でも動く。
    volumes:
      # data/ — 事実上の「口座」。ここを失うと復旧不能なものが多い。
      #   portfolio.json          : 現在の保有ポジション
      #   trade_guard_state.json  : TradeGuard の発注抑止状態
      #   circuit_breaker_state.json : サーキットブレーカーの発動状態
      #   training/training_data.jsonl : 卒研用の学習データ（再生成不可）
      #   training/open_positions_index.json
      #   knowledge_base/         : Obsidian 互換 Wiki
      #   screener/, cache/       : スクリーナーのキャッシュ
      - ./data:/app/data

      # bbs/ — 1実行 = 1ファイルのセッション状態。
      # 各エージェントの判断根拠が残るので、後から
      # 「なぜこの銘柄を買ったのか」を追跡する唯一の記録になる。
      - ./bbs:/app/bbs

      # logs/ — health_check / daemon / weekly_reflection 等のログ。
      # 障害調査はここを見るところから始まるので、
      # コンテナと一緒に消えては困る。
      - ./logs:/app/logs

      # backups/ — cron が portfolio.json を日次コピーする先。
      # data/ が壊れたときの最後の砦なので、当然ホスト側に置く。
      - ./backups:/app/backups

      # chroma_db_saved/ — FundamentalAgent の RAG ベクトルストア。
      # SEC EDGAR から取得した決算書を埋め込みベクトル化したもの。
      # 消えると次回実行時に EDGAR から取り直し＋再ベクトル化になり、
      # 数十分かかるうえ EDGAR のレート制限にも当たる。
      # （data/ の下ではなくリポジトリ直下にあるのは、コード側が
      #   persist_dir="chroma_db_saved" と相対パス直書きしているため）
      - ./chroma_db_saved:/app/chroma_db_saved

      # HuggingFace モデルキャッシュ（名前付き volume）。
      # 上5つと違い「ホストのどのディレクトリか」を指定せず、
      # Docker に管理を任せる形式。中身は自動ダウンロードされる
      # 埋め込みモデル(約470MB)で、消えても再取得できるため
      # git 管理下のディレクトリに置く必要がない。
      # ただし `run --rm` のたびに 470MB 落とすのは論外なので
      # volume にして使い回す。
      - hf-cache:/home/bot/.cache/huggingface

    # 念のため明示。Dockerfile の WORKDIR と同じ。
    # このボットは相対パスでファイルを読み書きするので、
    # カレントが /app からずれると data/ を見つけられない。
    working_dir: /app

    # コンテナ内でも UID/GID を明示しておく。
    # Dockerfile の USER bot と同じ値だが、ここに書いておくと
    # ホストの UID が 1000 でない環境でも
    # `HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose run ...` で上書きできる。
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    # 標準出力に色付けやプログレスバーを出す処理があるため、
    # 端末として振る舞わせておくと手動実行時に読みやすい。
    # （cron 経由ではただのパイプになるので影響しない）
    tty: true

# ── 名前付き volume の宣言 ──────────────────────────────────
# services 側で使った名前付き volume はここで宣言が必要。
# 実体は /var/lib/docker/volumes/ 配下に Docker が作る。
# 中身を消したいときは `docker compose down -v`
# （※ ./data などのホストマウントは -v でも消えない。安全）
volumes:
  hf-cache:
